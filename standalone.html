<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Baseball — MLB Standings</title>
  <meta name="description" content="A spinning 3D baseball that opens the MLB standings for the American and National League.">
  <meta name="theme-color" content="#fbf8f0">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23f5f2ea' stroke='%23d8d2c4'/%3E%3Cpath d='M9.5 4.5Q16 16 9.5 27.5M22.5 4.5Q16 16 22.5 27.5' fill='none' stroke='%23b5232b' stroke-width='2' stroke-dasharray='2 1.6'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Besley:wght@500;700;800&family=Sometype+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
:root {
  --bg: #fbf8f0;
  --bg-glow: #fffdf8;
  --ink: #1a2634;
  --muted: #6e7480;
  --line: rgba(26, 38, 52, 0.14);
  --rule: #1a2634;
  --red: #b5232b;
  --serif: 'Besley', 'Clarendon', Georgia, serif;
  --mono: 'Sometype Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);

  /* playoff status */
  --z: #14532d;  /* best record in league */
  --y: #2f8a4c;  /* division */
  --w: #c7891a;  /* wild card */
  --x: #2f6db3;  /* playoff berth */
  --e: #a9a59b;  /* eliminated */
}

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--mono);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* ---------- views ---------- */
.view {
  position: fixed;
  inset: 0;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.7s var(--ease), visibility 0s linear 0.7s;
}
.view.is-active {
  opacity: 1;
  visibility: visible;
  transition: opacity 0.7s var(--ease) 0.05s, visibility 0s;
}

/* ---------- front page ---------- */
#home {
  background: radial-gradient(58% 60% at 50% 46%, var(--bg-glow) 0%, var(--bg) 72%);
}
#stage {
  position: absolute;
  inset: 0;
  outline: none;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  transition: transform 0.75s cubic-bezier(0.6, 0, 0.2, 1), opacity 0.6s ease 0.1s;
}
#stage canvas { display: block; }
#stage.is-launching { opacity: 0; }
#stage:focus-visible { box-shadow: inset 0 0 0 2px rgba(181, 35, 43, 0.35); }

body:not(.is-ready) #stage { opacity: 0; }
body.is-ready #stage:not(.is-launching) { animation: ballIn 1.1s var(--ease) backwards; }
@keyframes ballIn {
  from { opacity: 0; transform: translateY(14px) scale(0.96); }
  to   { opacity: 1; transform: none; }
}

/* ---------- standings page ---------- */
#standings {
  overflow-y: auto;
  overflow-x: hidden;
  background: var(--bg);
}
#standings.is-active .bar,
#standings.is-active .content > * { animation: rise 0.8s var(--ease) both; }
#standings.is-active .content > :nth-child(1) { animation-delay: 0.10s; }
#standings.is-active .content > :nth-child(2) { animation-delay: 0.16s; }
#standings.is-active .content > :nth-child(3) { animation-delay: 0.24s; }
@keyframes rise {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: none; }
}

/* top bar: wordmark · league nav · updated */
.bar {
  position: sticky;
  top: 0;
  z-index: 5;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 24px;
  padding: 22px 56px;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.mark {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  justify-self: start;
  color: var(--ink);
  text-decoration: none;
  font-family: var(--serif);
  font-weight: 800;
  font-size: 20px;
  letter-spacing: 0.01em;
  text-transform: uppercase;
}
.mark svg { transition: transform 0.6s var(--ease); }
.mark:hover svg { transform: rotate(-200deg); }
.mark:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }

.switch { display: flex; gap: 28px; }
.switch button {
  border: 0;
  background: none;
  padding: 4px 0;
  cursor: pointer;
  font-family: var(--serif);
  font-weight: 500;
  font-size: 19px;
  text-transform: uppercase;
  color: var(--ink);
  text-decoration: underline;
  text-decoration-color: transparent;
  text-decoration-thickness: 1.5px;
  text-underline-offset: 5px;
  white-space: nowrap;
  transition: text-decoration-color 0.25s ease, opacity 0.25s ease;
  opacity: 0.55;
}
.switch button:hover { opacity: 1; }
.switch button.is-on { opacity: 1; text-decoration-color: currentColor; }
.switch button:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }

.updated {
  justify-self: end;
  font-size: 12px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--muted);
}

.content {
  width: min(1440px, 100%);
  margin: 0 auto;
  padding: 64px 56px 88px;
}

.eyebrow {
  margin: 0 0 18px;
  font-size: 13px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

h1 {
  margin: 0 0 56px;
  font-family: var(--serif);
  font-weight: 800;
  font-size: clamp(44px, 8vw, 104px);
  line-height: 0.95;
  letter-spacing: -0.01em;
  text-transform: uppercase;
  transition: opacity 0.18s ease, transform 0.18s ease;
}
h1.is-swapping { opacity: 0; transform: translateY(6px); }

/* ---------- tables ---------- */
.divisions {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 48px 40px;
  transition: opacity 0.18s ease, transform 0.18s ease;
}
.divisions.is-swapping { opacity: 0; transform: translateY(8px); }

.card {
  animation: rise 0.7s var(--ease) both;
  animation-delay: calc(var(--i) * 70ms);
}
.card-wide { grid-column: 1 / -1; max-width: calc((100% - 40px) * 2 / 3 + 0px); }

.card-head {
  padding-bottom: 12px;
  border-bottom: 2px solid var(--rule);
}
.card-head h2 {
  margin: 0;
  font-family: var(--serif);
  font-weight: 700;
  font-size: 26px;
  line-height: 1;
  text-transform: uppercase;
}

.row {
  position: relative;
  display: grid;
  grid-template-columns: 16px minmax(0, 1fr) 28px 30px 44px 40px 40px;
  align-items: center;
  column-gap: 6px;
  height: 48px;
  padding: 0 10px 0 14px;
  font-size: 14px;
  font-variant-numeric: tabular-nums;
  border-bottom: 1px solid var(--line);
}
.table-wildcard .row { grid-template-columns: 22px minmax(0, 1fr) 40px 40px 56px 56px 56px 48px; }
.row-head {
  height: 36px;
  font-size: 11px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
}
.row-head span:not(.team-col):not(.rank) { text-align: right; }

/* status bar on the left edge of each row */
.row::before {
  content: '';
  position: absolute;
  left: 0;
  top: 6px;
  bottom: 6px;
  width: 4px;
  background: var(--s, transparent);
}
.row.is-z { --s: var(--z); }
.row.is-y { --s: var(--y); }
.row.is-w { --s: var(--w); }
.row.is-x { --s: var(--x); }
.row.is-e { --s: var(--e); }
.row.is-z, .row.is-y, .row.is-w, .row.is-x {
  background: color-mix(in srgb, var(--s) 7%, transparent);
}
.row.is-e .team, .row.is-e .num { color: var(--muted); }
.row.is-e .logo { filter: grayscale(1); opacity: 0.7; }

/* the wild-card cut line: teams above it are in */
.row.is-cut { border-bottom: 2px dashed var(--ink); }

.rank { color: var(--muted); font-size: 12px; }
.team {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
  font-weight: 500;
  white-space: nowrap;
}
.logo { flex: none; width: 22px; height: 22px; object-fit: contain; }
.nick { overflow: hidden; text-overflow: ellipsis; }
.num { text-align: right; }
.soft { color: var(--muted); }

.tag {
  flex: none;
  display: inline-grid;
  place-items: center;
  width: 17px;
  height: 17px;
  font-size: 11px;
  font-weight: 700;
  line-height: 1;
  text-decoration: none;
  color: #fff;
  background: var(--s, var(--ink));
  cursor: help;
}

/* ---------- legend + states ---------- */
.legend {
  grid-column: 1 / -1;
  display: flex;
  flex-wrap: wrap;
  gap: 12px 28px;
  margin: -8px 0 0;
  padding: 20px 0 0;
  list-style: none;
  border-top: 1px solid var(--line);
  font-size: 12px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.legend li { display: flex; align-items: center; gap: 10px; }
.legend .is-z { --s: var(--z); }
.legend .is-y { --s: var(--y); }
.legend .is-w { --s: var(--w); }
.legend .is-x { --s: var(--x); }
.legend .is-e { --s: var(--e); }
.legend .tag { cursor: default; }

.state {
  grid-column: 1 / -1;
  margin: 0;
  padding: 48px 0;
  font-size: 14px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--muted);
}
.state p { margin: 0 0 18px; }
.btn {
  border: 1.5px solid var(--ink);
  border-radius: 0;
  background: none;
  padding: 12px 22px;
  font: inherit;
  font-weight: 500;
  color: var(--ink);
  cursor: pointer;
  text-transform: uppercase;
  transition: background 0.2s ease, color 0.2s ease;
}
.btn:hover { background: var(--ink); color: var(--bg); }

.credit {
  margin-top: 64px;
  padding-top: 20px;
  border-top: 1px solid var(--line);
  font-size: 12px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--muted);
}

/* ---------- responsive ---------- */
@media (max-width: 1280px) {
  .divisions { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .card-wide { max-width: none; }
}
@media (max-width: 900px) {
  .bar { grid-template-columns: auto 1fr; padding: 16px 24px; }
  .switch { justify-self: end; gap: 18px; }
  .switch button { font-size: 16px; }
  .updated { display: none; }
  .content { padding: 44px 24px 64px; }
  .divisions { grid-template-columns: minmax(0, 1fr); gap: 40px; }
}
@media (max-width: 560px) {
  .bar { grid-template-columns: 1fr; gap: 12px; padding: 14px 16px; }
  .mark { font-size: 17px; }
  .switch { justify-self: start; }
  .switch button { font-size: 15px; }
  .content { padding: 32px 16px 56px; }
  h1 { margin-bottom: 36px; }
  .row,
  .table-wildcard .row { grid-template-columns: 18px minmax(0, 1fr) 28px 28px 44px 38px; padding: 0 4px 0 10px; font-size: 13px; column-gap: 4px; }
  .opt { display: none; }
  .logo { width: 20px; height: 20px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}
</style>
</head>
<body data-view="home">

  <!-- Front page: the ball -->
  <main id="home" class="view is-active">
    <div id="stage" role="button" tabindex="0" aria-label="Spinning baseball. Press to open the MLB standings."></div>
  </main>

  <!-- Standings -->
  <main id="standings" class="view" aria-hidden="true">
    <header class="bar">
      <a id="back" class="mark" href="#" aria-label="Back to the baseball">
        <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true">
          <circle cx="16" cy="16" r="14.5" fill="#fff" stroke="currentColor" stroke-width="1.5"/>
          <path d="M9.5 4.5Q16 16 9.5 27.5M22.5 4.5Q16 16 22.5 27.5" fill="none" stroke="#b5232b" stroke-width="1.8" stroke-dasharray="1.9 1.7" stroke-linecap="round"/>
        </svg>
        <span>Standings</span>
      </a>

      <nav class="switch" role="tablist" aria-label="League">
        <button role="tab" data-league="AL" aria-selected="true">American League</button>
        <button role="tab" data-league="NL" aria-selected="false" tabindex="-1">National League</button>
      </nav>

      <span id="updated" class="updated"></span>
    </header>

    <div class="content">
      <p id="eyebrow" class="eyebrow">&nbsp;</p>
      <h1 id="leagueTitle">American League.</h1>
      <section id="divisions" class="divisions" aria-live="polite"></section>
      <footer class="credit">Data and logos © MLB Advanced Media. Not affiliated with MLB.</footer>
    </div>
  </main>
